name: Vérifications du code V3
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Vérifications V3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Dépendances isolées
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntaxe
        run: npm run check
      - name: Tests isolés
        run: npm test
      - name: Déploiement et retour arrière
        run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - name: Interface isolée ordinateur et mobile
        run: |
          mkdir -p proofs
          npm install --no-save --ignore-scripts --package-lock=false @playwright/test@1.64.0
          npx playwright install --with-deps chromium
          npx playwright test
