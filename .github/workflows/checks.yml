name: Vérifications du code V3
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    name: Vérifications V3
    runs-on: ubuntu-latest
    services:
      quota-test-postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Dépendances isolées
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Syntaxe
        run: npm run check
      - name: Tests isolés
        run: |
          npm test
          npm run test:tracking --if-present
      - name: Quota partagé PostgreSQL entre trois processus isolés
        env:
          TEST_QUOTA_DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
        run: |
          node scripts/test-quota-postgres.mjs
          node --test test/suspension-local-postgres.test.mjs
      - name: Déploiement et retour arrière
        run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - name: Interface isolée ordinateur et mobile
        run: |
          mkdir -p proofs
          npm install --no-save --ignore-scripts --package-lock=false @playwright/test@1.64.0
          npx playwright install --with-deps chromium
          npx playwright test
      - name: Preuves visuelles des tests isolés
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: verification-ui
          path: proofs/
          if-no-files-found: warn
