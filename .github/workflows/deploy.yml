name: Publication automatique V3
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v3-production-section-7
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Installer les dÃ©pendances isolÃ©es
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run check
      - run: npm test
      - name: Tests du dÃ©ploiement et du retour arriÃ¨re
        run: python3 -m unittest discover -s deploy -p 'test_*.py'
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://v3.nextechlogistic.fr/
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - name: PrÃ©parer la connexion limitÃ©e
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_SSH_KEY"
          umask 077
          mkdir -p "$RUNNER_TEMP/v3-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/v3-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/v3-ssh/known_hosts"
      - name: Publication par lâ€™exÃ©cuteur Section 7
        shell: bash
        run: |
          set -euo pipefail
          ssh -T -i "$RUNNER_TEMP/v3-ssh/key" -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/v3-ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $TARGET_SHA" | tee deployment-report.json
      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v3-deployment-report
          path: deployment-report.json
          if-no-files-found: ignore
      - name: Effacer la clÃ© temporaire
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/v3-ssh/key"
