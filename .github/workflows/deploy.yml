name: Déployer V3
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: [.github/deployment-request.json]
permissions:
  contents: read
concurrency:
  group: v3-production-section-7
  cancel-in-progress: false
jobs:
  verify:
    name: Préparation publication V3
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Valider la demande versionnée
        if: github.event_name == 'push'
        env:
          EXPECTED_BASE: ${{ github.event.before }}
        run: |
          python3 <<'PY'
          import json, os
          from pathlib import Path
          request = json.loads(Path('.github/deployment-request.json').read_text())
          assert request.get('schemaVersion') == 1, 'Version de demande invalide'
          assert request.get('deploy') is True, 'Demande de déploiement explicite absente'
          assert request.get('branch') == 'main', 'Seule main peut être publiée'
          assert request.get('baseCommit') == os.environ['EXPECTED_BASE'], 'Demande préparée pour un autre état de main'
          assert request.get('reason'), 'Motif de la demande absent'
          PY
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
      - name: Vérifications isolées et preuves
        run: |
          set -euo pipefail
          mkdir -p proofs
          {
            npm ci --ignore-scripts --no-audit --no-fund
            npm run check
            npm test
            npm run test:tracking --if-present
            python3 -m unittest discover -s deploy -p 'test_*.py'
          } 2>&1 | tee proofs/checks.log
          npm install --no-save --ignore-scripts --package-lock=false @playwright/test@1.64.0
          npx playwright install --with-deps chromium
          npx playwright test
          python3 scripts/package-ci-proof.py "$GITHUB_SHA"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: publication-packet
          path: publication-packet.json
  deploy:
    name: Publication V3 (Section 7)
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment:
      name: production
      url: https://v3.nextechlogistic.fr/
    env:
      DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PORT: ${{ vars.DEPLOY_PORT }}
      DEPLOY_KNOWN_HOSTS: ${{ vars.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      TARGET_SHA: ${{ github.sha }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: publication-packet
      - name: Préparer la connexion limitée
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_KNOWN_HOSTS"
          test -n "$DEPLOY_SSH_KEY"
          umask 077
          mkdir -p "$RUNNER_TEMP/v3-ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$RUNNER_TEMP/v3-ssh/key"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$RUNNER_TEMP/v3-ssh/known_hosts"
      - name: Publication par l’exécuteur Section 7
        env:
          GITHUB_READ_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -c 'import json,os,sys; p=json.load(open("publication-packet.json")); p["_githubReadToken"]=os.environ["GITHUB_READ_TOKEN"]; json.dump(p,sys.stdout)' | \
          ssh -T -i "$RUNNER_TEMP/v3-ssh/key" -p "${DEPLOY_PORT:-22}" \
            -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/v3-ssh/known_hosts" \
            -o ConnectTimeout=20 -o ServerAliveInterval=30 -o ServerAliveCountMax=10 \
            "$DEPLOY_USER@$DEPLOY_HOST" "deploy $TARGET_SHA" | tee deployment-report.json
      - name: Conserver le rapport
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: v3-deployment-report
          path: deployment-report.json
          if-no-files-found: ignore
      - name: Effacer la clé temporaire
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/v3-ssh/key"
